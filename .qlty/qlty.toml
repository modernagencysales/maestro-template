# qlty — the gate that catches what ESLint can't: cross-file DUPLICATION
# (identical/similar code) plus secret + dependency scanning. Block mode,
# full-repo. Greenfield starts at zero duplication, so block is safe and
# copy-paste sprawl can never take root.
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/_generated/**",
  "apps/web/src/routeTree.gen.ts",
  "packages/template-core/src/generated/**",
  "packages/template-core/src/generated/confectManifest.ts",
  "**/packages/template-core/src/generated/confectManifest.ts",
  "**/*.d.ts",
  "pnpm-lock.yaml",
  "tooling/**",
  "repos/**",
  ".pnpm-store/**",
]

test_patterns = ["**/*.test.*", "**/*.spec.*", "**/__tests__/**"]

[[source]]
name = "default"
default = true

# Structural smells — BLOCKING (greenfield = 0; any new duplication/complexity
# is rejected). ESLint owns per-function complexity at the source; qlty adds
# the cross-file duplication detection ESLint cannot do.
[smells]
mode = "block"

[smells.identical_code]
threshold = 12
[smells.similar_code]
threshold = 15
[smells.function_complexity]
threshold = 10
[smells.file_complexity]
threshold = 50
[smells.return_statements]
threshold = 5
[smells.boolean_logic]
threshold = 4
[smells.function_parameters]
threshold = 5
[smells.nested_control_flow]
threshold = 4

[[triage]]
match.rules = ["qlty:similar-code"]
match.file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]
set.ignored = true

[[exclude]]
plugins = ["qlty"]
file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]

[[plugin]]
name = "gitleaks"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"
